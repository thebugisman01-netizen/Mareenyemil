<!DOCTYPE html>
<html lang="id" data-theme="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catat Jualan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#12302b;--mut:#5f7771;--line:#d9e3df;--pri:#0f766e;--prit:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--ok:#15803d}
[data-theme=gelap]{--bg:#0e1b19;--card:#162825;--ink:#e6f2ef;--mut:#8fa9a3;--line:#27403b;--pri:#2dd4bf;--prit:#06231f;--warn:#fbbf24;--warnbg:#3a2d0a;--bad:#f87171;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h2,h3{margin:0 0 10px}h2{font-size:20px}h3{font-size:16px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:500}
button.p{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:700}
button.d{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pri);color:var(--prit)}
.top b{font-size:17px;font-weight:800}.top button{background:transparent;color:inherit;border-color:currentColor;padding:5px 10px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;white-space:nowrap;color:var(--mut)}
nav button.on{background:var(--pri);color:var(--prit);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px}
.item span{color:var(--pri);font-weight:700}.item small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.s{flex:none}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:20px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
.tag{background:var(--warnbg);color:var(--warn);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.qty{display:flex;align-items:center;gap:4px}.qty button{padding:2px 9px}.qty input{width:52px;text-align:center;padding:4px}
.big{font-size:24px;font-weight:800}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;display:none}
.login{max-width:380px;margin:8vh auto;padding:0 16px}.login h1{font-size:30px;font-weight:800;margin:0 0 4px;color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}.tabs .on{background:var(--pri);color:var(--prit)}
.empty{color:var(--mut);padding:14px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ====== PENGATURAN: isi dengan URL Web App Apps Script. Kosong = mode lokal (demo, data di browser) ====== */
const API_URL='https://script.google.com/macros/s/AKfycbx6pAJDvO_pq-GXCR7RPvO5cjN9cUYUBhfptjbsj1F9vD59RHmE4fKnpOKeb3X2FLEe/exec';

const SH={Users:['id','username','hash','toko'],Barang:['id','nama','harga','modal','stok','min'],Transaksi:['id','waktu','items','total','bayar','kembali'],Keuangan:['id','tanggal','jenis','ket','jumlah'],Pengaturan:['key','value']};
const NUM={Barang:['harga','modal','stok','min'],Transaksi:['total','bayar','kembali'],Keuangan:['jumlah']};
let D={},U=null,cart={},payVal='',tab='kasir',mode='in',Q=Promise.resolve();
const $=s=>document.querySelector(s),V={};
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const dayOf=t=>new Date(t).toLocaleDateString('sv');
const items=t=>{try{return JSON.parse(t.items||'[]')}catch{return[]}};
const cfg=k=>(D.Pengaturan.find(r=>r.key===k)||{}).value||'';
const bar=id=>D.Barang.find(b=>b.id==id);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- Data layer (Google Sheets / lokal) ---------- */
const persist=()=>localStorage.setItem('cj_db',JSON.stringify(D));
function post(p){Q=Q.then(()=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)})).catch(()=>toast('Gagal sinkron ke spreadsheet'))}
function upsert(sh,row){const k=SH[sh][0],i=D[sh].findIndex(r=>r[k]==row[k]);i<0?D[sh].push(row):D[sh][i]=row;persist();API_URL&&post({sheet:sh,row})}
function del(sh,id){const k=SH[sh][0];D[sh]=D[sh].filter(r=>r[k]!=id);persist();API_URL&&post({op:'del',sheet:sh,row:{[k]:id}})}
async function load(){
  let raw={};
  try{raw=API_URL?await (await fetch(API_URL)).json():JSON.parse(localStorage.getItem('cj_db')||'{}')}catch{toast('Gagal memuat data dari spreadsheet')}
  for(const sh in SH)D[sh]=(raw[sh]||[]).map(r=>{(NUM[sh]||[]).forEach(k=>r[k]=Number(r[k])||0);return r});
}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}

/* ---------- Login ---------- */
function loginView(){
  const f={in:['Masuk',''],up:['Daftar','<label>Nama toko</label><input id=lt>'],forgot:['Atur ulang sandi','<label>Nama toko (untuk verifikasi)</label><input id=lt>']}[mode];
  $('#app').innerHTML=`<div class=login><h1>Catat Jualan</h1><p class=mut>Kasir, stok, dan uang toko dalam satu tempat.</p>
  <div class=tabs><button class="${mode=='in'?'on':''}" onclick="mode='in';loginView()">Masuk</button><button class="${mode=='up'?'on':''}" onclick="mode='up';loginView()">Daftar</button></div>
  <div class=card><label>Nama pengguna</label><input id=lu autocomplete=username>${f[1]}
  <label>${mode=='forgot'?'Sandi baru':'Sandi'}</label><input id=lp type=password autocomplete=current-password>
  <p><button class=p style="width:100%" onclick="auth()">${f[0]}</button></p>
  ${mode=='in'?'<button style="width:100%;border:0;color:var(--mut)" onclick="mode=\'forgot\';loginView()">Lupa sandi?</button>':''}</div></div>`;
}
async function auth(){
  const un=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,toko=$('#lt')?.value.trim();
  if(!un||pw.length<4)return toast('Isi nama pengguna dan sandi (minimal 4 karakter)');
  const h=await hash(pw),u=D.Users.find(x=>x.username==un);
  if(mode=='up'){
    if(u)return toast('Nama pengguna sudah dipakai');if(!toko)return toast('Isi nama toko');
    U={id:uid(),username:un,hash:h,toko};upsert('Users',U);if(!cfg('toko'))upsert('Pengaturan',{key:'toko',value:toko});
  }else if(mode=='forgot'){
    if(!u||u.toko.toLowerCase()!=(toko||'').toLowerCase())return toast('Nama pengguna atau nama toko tidak cocok');
    U={...u,hash:h};upsert('Users',U);
  }else{
    if(!u||u.hash!=h)return toast('Nama pengguna atau sandi salah');U=u;
  }
  localStorage.setItem('cj_u',U.id);start();
}
function logout(){localStorage.removeItem('cj_u');U=null;mode='in';loginView()}

/* ---------- Shell ---------- */
const TABS=[['kasir','Kasir'],['stok','Stok barang'],['barang','Daftar barang'],['uang','Catatan uang'],['riwayat','Riwayat'],['laporan','Laporan'],['set','Pengaturan']];
function start(){
  document.documentElement.dataset.theme=cfg('tema')||'terang';
  $('#app').innerHTML=`<div class=top><b>${esc(cfg('toko')||U.toko)}</b><button onclick=logout()>Keluar</button></div><nav>${TABS.map(t=>`<button id=t_${t[0]} onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main id=v></main>`;
  go(tab);
}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t_'+t));V[t]()}

/* ---------- Kasir ---------- */
V.kasir=()=>{cart={};payVal='';$('#v').innerHTML=`<div class=g2><div class=card><h2>Pilih barang</h2><input id=q placeholder="Cari barang..." oninput=drawP()><div id=P class=grid></div></div><div class=card><h2>Keranjang</h2><div id=C></div></div></div>`;drawP();drawC()};
function drawP(){
  const q=($('#q')?.value||'').toLowerCase(),L=D.Barang.filter(b=>b.nama.toLowerCase().includes(q));
  $('#P').innerHTML=L.length?L.map(b=>`<button class=item onclick="add('${b.id}')" ${b.stok<=0?'disabled':''}><b>${esc(b.nama)}</b><span>${rp(b.harga)}</span><small>${b.stok>0?'Stok '+b.stok:'Habis'}</small></button>`).join(''):'<p class=empty style="grid-column:1/-1">Belum ada barang. Tambahkan di menu Daftar barang.</p>';
}
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+q*bar(id).harga,0);
function add(id){const b=bar(id);if((cart[id]||0)>=b.stok)return toast('Stok '+b.nama+' tidak cukup');cart[id]=(cart[id]||0)+1;drawC()}
function setQ(id,v){const b=bar(id);v=Math.floor(Number(v)||0);if(v>b.stok){v=b.stok;toast('Stok tersisa '+b.stok)}v<=0?delete cart[id]:cart[id]=v;drawC()}
function drawC(){
  const e=Object.entries(cart);
  $('#C').innerHTML=(e.length?e.map(([id,q])=>{const b=bar(id);return`<div class=row style="margin-bottom:8px"><div>${esc(b.nama)}<br><small class=mut>${rp(b.harga)}</small></div><div class="qty s"><button onclick="setQ('${id}',${q-1})">-</button><input type=number value=${q} onchange="setQ('${id}',this.value)"><button onclick="setQ('${id}',${q+1})">+</button></div><b class="s" style="min-width:80px;text-align:right">${rp(q*b.harga)}</b></div>`}).join(''):'<p class=empty>Ketuk barang untuk menambah.</p>')+
  `<hr style="border:0;border-top:1px solid var(--line)"><div class=row><span>Total</span><span class=big style="text-align:right">${rp(total())}</span></div>
  <label>Uang diterima</label><input id=pay type=number inputmode=numeric value="${payVal}" oninput="payVal=this.value;calcK()">
  <div class=row style="margin:10px 0"><span>Kembalian</span><b id=kb style="text-align:right"></b></div><button class=p style="width:100%" onclick=bayar() ${e.length?'':'disabled'}>Simpan transaksi</button>`;calcK();
}
function calcK(){const k=(Number(payVal)||0)-total();const el=$('#kb');if(el){el.textContent=payVal===''?'-':(k<0?'Kurang '+rp(-k):rp(k));el.className=k<0?'bad':''}}
function bayar(){
  const t=total(),p=Number(payVal)||0;if(p<t)return toast('Uang diterima kurang '+rp(t-p));
  const its=Object.entries(cart).map(([id,qty])=>{const b=bar(id);return{id,nama:b.nama,harga:b.harga,modal:b.modal,qty}});
  upsert('Transaksi',{id:'TRX-'+uid().toUpperCase(),waktu:new Date().toISOString(),items:JSON.stringify(its),total:t,bayar:p,kembali:p-t});
  its.forEach(i=>{const b=bar(i.id);upsert('Barang',{...b,stok:b.stok-i.qty})});
  toast('Tersimpan. Kembalian '+rp(p-t));V.kasir();
}

/* ---------- Stok ---------- */
V.stok=()=>{
  const low=D.Barang.filter(b=>b.stok<=b.min);
  $('#v').innerHTML=`<div class=g2><div class=card><h2>Stok saat ini</h2>${D.Barang.length?`<table><tr><th>Barang<th class=r>Stok<th></tr>${D.Barang.map(b=>`<tr><td>${esc(b.nama)}<td class=r>${b.stok}<td>${b.stok<=b.min?'<span class=tag>'+(b.stok<=0?'Habis':'Hampir habis')+'</span>':''}</tr>`).join('')}</table>`:'<p class=empty>Belum ada barang.</p>'}</div>
  <div><div class=card><h3>Catat stok masuk</h3><label>Barang</label><select id=sb>${D.Barang.map(b=>`<option value="${b.id}">${esc(b.nama)}</option>`).join('')}</select><label>Jumlah masuk</label><input id=sj type=number min=1>
  <label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type=checkbox id=sc style="width:auto" checked>Catat sebagai pengeluaran (modal × jumlah)</label><p><button class=p onclick=stokMasuk()>Simpan stok masuk</button></p></div>
  <div class=card><h3>Stok hampir habis</h3>${low.length?low.map(b=>`<div class=row><span>${esc(b.nama)}</span><b class="s bad">${b.stok}</b></div>`).join(''):'<p class=mut>Semua stok masih aman.</p>'}</div></div></div>`;
};
function stokMasuk(){
  const b=bar($('#sb').value),n=Math.floor(Number($('#sj').value));if(!b||n<1)return toast('Pilih barang dan isi jumlah');
  upsert('Barang',{...b,stok:b.stok+n});
  if($('#sc').checked&&b.modal>0)upsert('Keuangan',{id:uid(),tanggal:today(),jenis:'keluar',ket:'Stok masuk: '+b.nama+' x'+n,jumlah:b.modal*n});
  toast('Stok '+b.nama+' bertambah '+n);V.stok();
}

/* ---------- Daftar barang ---------- */
V.barang=()=>{$('#v').innerHTML=`<div class=g2><div class=card><h2>Barang</h2><input id=bq placeholder="Cari barang..." oninput=drawB()><div id=BL></div></div>
<div class=card><h3 id=bt>Tambah barang</h3><input type=hidden id=bid><label>Nama barang</label><input id=bn><div class=row><div><label>Harga jual</label><input id=bh type=number></div><div><label>Harga modal</label><input id=bm type=number></div></div>
<div class=row><div><label>Stok</label><input id=bs type=number value=0></div><div><label>Batas stok menipis</label><input id=bl type=number value=5></div></div><p class=row><button class=p onclick=saveB()>Simpan barang</button><button class=s onclick=V.barang()>Kosongkan</button></p></div></div>`;drawB()};
function drawB(){
  const q=($('#bq')?.value||'').toLowerCase(),L=D.Barang.filter(b=>b.nama.toLowerCase().includes(q));
  $('#BL').innerHTML=L.length?`<table><tr><th>Nama<th class=r>Harga<th class=r>Stok<th></tr>${L.map(b=>`<tr><td>${esc(b.nama)}<td class=r>${rp(b.harga)}<td class=r>${b.stok}<td class=r style="white-space:nowrap"><button onclick="editB('${b.id}')">Ubah</button> <button class=d onclick="delB('${b.id}')">Hapus</button></tr>`).join('')}</table>`:'<p class=empty>Tidak ada barang.</p>';
}
function editB(id){const b=bar(id);$('#bt').textContent='Ubah barang';bid.value=b.id;bn.value=b.nama;bh.value=b.harga;bm.value=b.modal;bs.value=b.stok;bl.value=b.min;bn.focus()}
function saveB(){
  const nama=bn.value.trim(),harga=Number(bh.value);if(!nama||!(harga>0))return toast('Isi nama dan harga jual');
  upsert('Barang',{id:bid.value||uid(),nama,harga,modal:Number(bm.value)||0,stok:Math.max(0,Math.floor(Number(bs.value))||0),min:Math.floor(Number(bl.value))||0});
  toast('Barang tersimpan');V.barang();
}
function delB(id){if(confirm('Hapus barang ini? Riwayat transaksi tidak ikut terhapus.')){del('Barang',id);drawB()}}

/* ---------- Catatan uang ---------- */
function daily(){
  const m={};const g=d=>m[d]=m[d]||{masuk:0,keluar:0};
  D.Keuangan.forEach(k=>g(k.tanggal)[k.jenis=='masuk'?'masuk':'keluar']+=k.jumlah);
  D.Transaksi.forEach(t=>g(dayOf(t.waktu)).masuk+=t.total);
  let s=0;return Object.keys(m).sort().map(d=>{s+=m[d].masuk-m[d].keluar;return{d,...m[d],saldo:s}});
}
V.uang=()=>{
  const L=daily(),tdy=L.find(x=>x.d==today())||{masuk:0,keluar:0},saldo=L.length?L[L.length-1].saldo:0;
  $('#v').innerHTML=`<div class=g3><div class=stat><small>Saldo kas</small><b class="${saldo<0?'bad':''}">${rp(saldo)}</b></div><div class=stat><small>Masuk hari ini</small><b class=ok>${rp(tdy.masuk)}</b></div><div class=stat><small>Keluar hari ini</small><b class=bad>${rp(tdy.keluar)}</b></div></div>
  <div class=g2><div class=card><h3>Saldo kas harian</h3>${L.length?`<table><tr><th>Tanggal<th class=r>Masuk<th class=r>Keluar<th class=r>Saldo</tr>${L.slice().reverse().slice(0,30).map(x=>`<tr><td>${x.d}<td class=r>${rp(x.masuk)}<td class=r>${rp(x.keluar)}<td class=r><b>${rp(x.saldo)}</b></tr>`).join('')}</table>`:'<p class=empty>Belum ada catatan.</p>'}
  <p class=mut style="font-size:13px">Hasil penjualan kasir otomatis masuk sebagai pemasukan.</p></div>
  <div><div class=card><h3>Catat uang</h3><label>Jenis</label><select id=uj><option value=keluar>Pengeluaran<option value=masuk>Pemasukan lain</select><label>Keterangan</label><input id=uk><label>Jumlah</label><input id=um type=number><label>Tanggal</label><input id=ut type=date value="${today()}"><p><button class=p onclick=saveU()>Simpan catatan</button></p></div>
  <div class=card><h3>Catatan manual</h3>${D.Keuangan.slice().reverse().slice(0,15).map(k=>`<div class=row style="margin-bottom:6px"><span>${k.tanggal}<br>${esc(k.ket)}</span><b class="s ${k.jenis=='masuk'?'ok':'bad'}">${k.jenis=='masuk'?'+':'-'}${rp(k.jumlah)}</b><button class="s d" onclick="delU('${k.id}')">×</button></div>`).join('')||'<p class=mut>Belum ada.</p>'}</div></div></div>`;
};
function saveU(){const j=Number(um.value);if(!(j>0)||!uk.value.trim())return toast('Isi keterangan dan jumlah');upsert('Keuangan',{id:uid(),tanggal:ut.value||today(),jenis:uj.value,ket:uk.value.trim(),jumlah:j});toast('Catatan tersimpan');V.uang()}
function delU(id){del('Keuangan',id);V.uang()}

/* ---------- Riwayat ---------- */
V.riwayat=()=>{$('#v').innerHTML=`<div class=card><h2>Riwayat transaksi</h2><input id=rq placeholder="Cari nomor transaksi atau nama barang..." oninput=drawR()><div id=RL></div></div>`;drawR()};
function drawR(){
  const q=(rq.value||'').toLowerCase(),L=D.Transaksi.slice().reverse().filter(t=>!q||t.id.toLowerCase().includes(q)||items(t).some(i=>i.nama.toLowerCase().includes(q)));
  RL.innerHTML=L.length?L.slice(0,100).map(t=>`<details><summary><span>${new Date(t.waktu).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}<br><small class=mut>${esc(t.id)}</small></span><b>${rp(t.total)}</b></summary><table><tr><th>Barang<th class=r>Qty<th class=r>Subtotal</tr>${items(t).map(i=>`<tr><td>${esc(i.nama)}<td class=r>${i.qty} × ${rp(i.harga)}<td class=r>${rp(i.qty*i.harga)}</tr>`).join('')}</table><p class=mut>Dibayar ${rp(t.bayar)} · Kembali ${rp(t.kembali)}</p></details>`).join(''):'<p class=empty>Tidak ada transaksi.</p>';
}

/* ---------- Laporan ---------- */
let per=7;
V.laporan=()=>{
  const cut=per?new Date(Date.now()-(per-1)*864e5).toLocaleDateString('sv'):'0000';
  const T=D.Transaksi.filter(t=>dayOf(t.waktu)>=cut),K=D.Keuangan.filter(k=>k.tanggal>=cut);
  let omzet=0,hpp=0;const prod={};
  T.forEach(t=>items(t).forEach(i=>{omzet+=i.qty*i.harga;hpp+=i.qty*i.modal;const p=prod[i.nama]=prod[i.nama]||{q:0,r:0};p.q+=i.qty;p.r+=i.qty*i.harga}));
  const out=K.filter(k=>k.jenis=='keluar').reduce((s,k)=>s+k.jumlah,0),inn=K.filter(k=>k.jenis=='masuk').reduce((s,k)=>s+k.jumlah,0),net=omzet-hpp+inn-out;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toLocaleDateString('sv');return{d,v:D.Transaksi.filter(t=>dayOf(t.waktu)==d).reduce((s,t)=>s+t.total,0)}}),mx=Math.max(1,...days.map(x=>x.v));
  const top=Object.entries(prod).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  $('#v').innerHTML=`<div class=card><h3>Penjualan 7 hari terakhir</h3><svg viewBox="0 0 700 220" style="width:100%"><g font-size="12" fill="currentColor" text-anchor="middle">${days.map((x,i)=>{const h=x.v/mx*150,xx=20+i*95;return`<rect x="${xx}" y="${180-h}" width="70" height="${h}" rx="5" fill="var(--pri)"/><text x="${xx+35}" y="${172-h}">${x.v?rp(x.v):''}</text><text x="${xx+35}" y="205" class=mut>${x.d.slice(5)}</text>`}).join('')}</g></svg></div>
  <div class=row style="margin-bottom:10px"><h2 style="margin:0">Ringkasan</h2><select class=s style="width:auto" onchange="per=Number(this.value);V.laporan()">${[[1,'Hari ini'],[7,'7 hari'],[30,'30 hari'],[0,'Semua']].map(o=>`<option value=${o[0]} ${o[0]==per?'selected':''}>${o[1]}</option>`).join('')}</select></div>
  <div class=g2><div class=card><h3>Untung rugi</h3><table>${[['Penjualan',omzet],['Modal barang terjual',-hpp],['Pemasukan lain',inn],['Pengeluaran',-out]].map(r=>`<tr><td>${r[0]}<td class=r>${rp(r[1])}</tr>`).join('')}<tr><td><b>${net<0?'Rugi':'Untung'} bersih</b><td class="r ${net<0?'bad':'ok'}"><b>${rp(Math.abs(net))}</b></tr></table></div>
  <div class=card><h3>Barang paling laku</h3>${top.length?`<table>${top.map(([n,p])=>`<tr><td>${esc(n)}<td class=r>${p.q} terjual<td class=r>${rp(p.r)}</tr>`).join('')}</table>`:'<p class=empty>Belum ada penjualan pada periode ini.</p>'}</div></div>`;
};

/* ---------- Pengaturan ---------- */
V.set=()=>{$('#v').innerHTML=`<div class=g2><div class=card><h3>Profil toko</h3><label>Nama toko</label><input id=sn value="${esc(cfg('toko')||U.toko)}"><label>Alamat</label><input id=sa value="${esc(cfg('alamat'))}"><label>Tampilan</label><select id=st><option value=terang ${cfg('tema')!='gelap'?'selected':''}>Terang<option value=gelap ${cfg('tema')=='gelap'?'selected':''}>Gelap</select><p><button class=p onclick=saveS()>Simpan pengaturan</button></p></div>
<div class=card><h3>Cadangan data</h3><p class=mut>Penyimpanan: <b>${API_URL?'Google Sheets':'Lokal di browser (demo)'}</b></p><p><button onclick=exportD()>Unduh cadangan (.json)</button></p><label>Pulihkan dari file cadangan</label><input type=file accept=.json onchange=importD(this)></div></div>`};
function saveS(){upsert('Pengaturan',{key:'toko',value:sn.value.trim()});upsert('Pengaturan',{key:'alamat',value:sa.value.trim()});upsert('Pengaturan',{key:'tema',value:st.value});toast('Pengaturan tersimpan');start();go('set')}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='catat-jualan-'+today()+'.json';a.click()}
function importD(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);['Barang','Transaksi','Keuangan','Pengaturan'].forEach(sh=>(o[sh]||[]).forEach(x=>upsert(sh,x)));toast('Data berhasil dipulihkan');start();go('set')}catch{toast('File cadangan tidak valid')}};
  r.readAsText(f);
}

/* ---------- Mulai ---------- */
(async()=>{await load();const id=localStorage.getItem('cj_u');U=D.Users.find(u=>u.id==id)||null;if(!D.Users.length)mode='up';U?start():loginView()})();
</script>
