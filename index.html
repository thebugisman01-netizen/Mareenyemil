<!DOCTYPE html>
<html lang="id" data-theme="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catat Jualan</title>
<meta name="theme-color" content="#ffd21f">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Mono:wght@500&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe8;--card:#fffefa;--ink:#17170f;--bd:#17170f;--mut:#69685b;--line:#d6d3c6;--pri:#17170f;--prit:#ffd21f;--hi:#ffd21f;--hit:#17170f;--warn:#6b4a00;--warnbg:#ffe89a;--bad:#c2261b;--ok:#17803d;--sh:3px 3px 0 var(--bd);--bn:62px}
[data-theme=gelap]{--bg:#141410;--card:#1e1e18;--ink:#f1efe8;--bd:#57563f;--mut:#a3a293;--line:#38382d;--pri:#ffd21f;--prit:#17170f;--warn:#ffd21f;--warnbg:#4a3d05;--bad:#ff7a6e;--ok:#5fd88a;--sh:3px 3px 0 #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',sans-serif;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:800}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;min-height:46px;padding:9px 12px;border:2px solid var(--bd);border-radius:8px;background:var(--card)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--bd)}
input:focus,select:focus{outline:3px solid var(--hi);outline-offset:0}
button{cursor:pointer;min-height:44px;border:2px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:700}
button:active{transform:translate(1px,1px)}
button.p{background:var(--pri);color:var(--prit);box-shadow:var(--sh)}button.p:active{box-shadow:none}
button.d{color:var(--bad);border-color:var(--bad)}button.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* kerangka: bar bawah di HP, rail di tablet, sidebar di laptop */
aside{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
aside .brand,aside .out{display:none}
aside nav{display:flex}
aside nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;padding:6px 0;border:0;border-radius:0;min-height:var(--bn);background:none;color:var(--mut)}
aside nav button.on{background:var(--hi);color:var(--hit)}
.lf{display:none}
.mtop{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--hi);color:var(--hit);border-bottom:2px solid var(--bd);font:800 18px 'Bricolage Grotesque',sans-serif}
.mtop button{min-height:36px;padding:2px 12px;background:transparent;color:var(--hit);border-color:var(--hit);font:700 14px 'Figtree',sans-serif}
#v{max-width:1120px;margin:0 auto;padding:14px 14px calc(var(--bn) + 96px)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;overflow-x:auto}
.g2{display:grid;grid-template-columns:1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
@media(min-width:900px){.g2{grid-template-columns:1.3fr 1fr}}
.stat{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b,.big{font:500 22px 'DM Mono',monospace}.big{font-size:26px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.s{flex:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px dashed var(--line)}
th{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}td.r,th.r{text-align:right}td.r{font-family:'DM Mono',monospace}
.tag{background:var(--warnbg);color:var(--warn);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}.empty{color:var(--mut);padding:16px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.item{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;text-align:left;min-height:92px;padding:10px 12px}
.item span{background:var(--hi);color:var(--hit);padding:1px 7px;border-radius:4px;font:500 14px 'DM Mono',monospace}.item small{color:var(--mut);font-weight:600}
.qty{display:flex;align-items:center;gap:4px}.qty button{min-height:40px;min-width:40px;padding:0}.qty input{width:56px;min-height:40px;text-align:center;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{min-height:38px;padding:4px 10px;font-size:14px}
details{border-bottom:1px dashed var(--line);padding:4px 0}summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
/* kasir */
.kasir{display:grid;gap:14px}
.cartp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--bd);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;transform:translateY(105%);transition:transform .22s;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.cartp.open{transform:none}
.cartbar{display:none;position:fixed;left:10px;right:10px;bottom:calc(var(--bn) + 10px + env(safe-area-inset-bottom));z-index:15;justify-content:space-between;align-items:center;background:var(--pri);color:var(--prit);box-shadow:var(--sh);min-height:52px}
.cartbar.show{display:flex}
#toast{position:fixed;bottom:calc(var(--bn) + 84px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw;text-align:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#ov>div{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:18px;max-width:380px;width:100%;max-height:92dvh;overflow:auto}
.login{max-width:400px;margin:6vh auto;padding:0 16px}.login h1{font-size:36px;font-weight:800;margin:0 0 4px}
.login h1 span{background:var(--hi);color:var(--hit);padding:0 8px;border-radius:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--pri);color:var(--prit)}
@media(min-width:760px){
 aside{inset:0 auto 0 0;right:auto;width:92px;border-top:0;border-right:2px solid var(--bd);display:flex;flex-direction:column;padding:0}
 aside .brand{display:flex;align-items:center;gap:10px;padding:16px 0 8px;justify-content:center}
 .logo{background:var(--hi);color:var(--hit);border:2px solid var(--bd);border-radius:8px;width:44px;height:44px;display:grid;place-items:center;font:800 18px 'Bricolage Grotesque',sans-serif;flex:none}
 .bn{display:none}
 aside nav{flex-direction:column;padding:8px 8px;gap:4px}aside nav button{flex:none;min-height:62px;border-radius:8px}
 aside .out{display:block;margin:auto 10px 14px}
 .mtop{display:none}#v{padding:26px 28px 40px}main{margin-left:92px}
 .kasir{grid-template-columns:1fr 350px;align-items:start}
 .cartp{position:sticky;top:20px;transform:none;border:2px solid var(--bd);border-radius:12px;max-height:calc(100dvh - 40px);box-shadow:var(--sh);padding:16px}
 .cartbar,.closeb{display:none!important}#toast{bottom:24px}
}
@media(min-width:1100px){
 aside{width:240px}aside .brand{justify-content:flex-start;padding:18px 16px 10px}.bn{display:block;font:800 17px 'Bricolage Grotesque',sans-serif;line-height:1.15}
 aside nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:0 14px;min-height:46px}
 .lf{display:inline}.ls{display:none}main{margin-left:240px}
}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ====== PENGATURAN: isi dengan URL Web App Apps Script. Kosong = mode lokal (demo, data di browser) ====== */
const API_URL='https://script.google.com/macros/s/AKfycbx6pAJDvO_pq-GXCR7RPvO5cjN9cUYUBhfptjbsj1F9vD59RHmE4fKnpOKeb3X2FLEe/exec';

const SH={Users:['id','username','hash','toko','pin'],Barang:['id','nama','harga','modal','stok','min'],Transaksi:['id','waktu','items','total','bayar','kembali','customer','hp','metode','status','tgllunas'],Keuangan:['id','tanggal','jenis','ket','jumlah'],Pengaturan:['key','value']};
const NUM={Barang:['harga','modal','stok','min'],Transaksi:['total','bayar','kembali'],Keuangan:['jumlah']};
let D={},U=null,cart={},payVal='',custName='',custHp='',payMeth='cash',payStat='lunas',tab='kasir',mode='in',Q=Promise.resolve();
const $=s=>document.querySelector(s),V={};
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const dayOf=t=>new Date(t).toLocaleDateString('sv');
const isBelum=t=>t.status=='belum',sisa=t=>isBelum(t)?Math.max(0,t.total-t.bayar):0,metLbl=t=>t.metode=='qris'?'QRIS':t.metode=='tf'?'Transfer':'Tunai';
const items=t=>{try{return JSON.parse(t.items||'[]')}catch{return[]}};
const cfg=k=>(D.Pengaturan.find(r=>r.key===k)||{}).value||'';
const bar=id=>D.Barang.find(b=>b.id==id);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- Data layer (Google Sheets / lokal) ---------- */
const persist=()=>localStorage.setItem('cj_db',JSON.stringify(D));
function post(p){Q=Q.then(()=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}).then(r=>r.json()).then(j=>{if(!j.ok)throw 0})).catch(()=>toast('Gagal sinkron ke spreadsheet. Pastikan Code.gs sudah di-deploy versi terbaru'))}
function upsert(sh,row){const k=SH[sh][0],i=D[sh].findIndex(r=>r[k]==row[k]);i<0?D[sh].push(row):D[sh][i]=row;persist();API_URL&&post({sheet:sh,row})}
function del(sh,id){const k=SH[sh][0];D[sh]=D[sh].filter(r=>r[k]!=id);persist();API_URL&&post({op:'del',sheet:sh,row:{[k]:id}})}
function bulk(sh,rows){
  const k=SH[sh][0];
  rows.forEach(r=>{(NUM[sh]||[]).forEach(c=>r[c]=Number(r[c])||0);const i=D[sh].findIndex(x=>x[k]==r[k]);i<0?D[sh].push(r):D[sh][i]=r});
  persist();API_URL&&rows.length&&post({op:'bulk',sheet:sh,rows});
}
async function load(){
  let raw={};
  try{raw=API_URL?await (await fetch(API_URL)).json():JSON.parse(localStorage.getItem('cj_db')||'{}')}catch{toast('Gagal memuat data dari spreadsheet')}
  for(const sh in SH)D[sh]=(raw[sh]||[]).map(r=>{(NUM[sh]||[]).forEach(k=>r[k]=Number(r[k])||0);return r});
}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}

/* ---------- Login ---------- */
function loginView(){
  const f={in:['Masuk',''],up:['Daftar','<label>Nama toko</label><input id=lt>'],forgot:['Atur ulang sandi','<label>Kode pemulihan</label><input id=lt autocomplete=off placeholder="XXXX-XXXX"><p class=mut style="font-size:13px;margin:6px 0 0">Akun lama yang belum punya kode: isi nama toko.</p>']}[mode];
  $('#app').innerHTML=`<div class=login><h1>Catat <span>Jualan</span></h1><p class=mut>Kasir, stok, dan uang toko dalam satu tempat.</p>
  <div class=tabs><button class="${mode=='in'?'on':''}" onclick="mode='in';loginView()">Masuk</button><button class="${mode=='up'?'on':''}" onclick="mode='up';loginView()">Daftar</button></div>
  <div class=card><label>Nama pengguna</label><input id=lu autocomplete=username>${f[1]}
  <label>${mode=='forgot'?'Sandi baru':'Sandi'}</label><input id=lp type=password autocomplete=current-password>
  <p><button class=p style="width:100%" onclick="auth()">${f[0]}</button></p>
  ${mode=='in'?'<button style="width:100%;border:0;color:var(--mut)" onclick="mode=\'forgot\';loginView()">Lupa sandi?</button>':''}</div></div>`;
}
let newCode='';
async function auth(){
  const un=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value,toko=$('#lt')?.value.trim();
  if(!un||pw.length<4)return toast('Isi nama pengguna dan sandi (minimal 4 karakter)');
  const h=await hash(pw),u=D.Users.find(x=>x.username==un);
  if(mode=='up'){
    if(u)return toast('Nama pengguna sudah dipakai');if(!toko)return toast('Isi nama toko');
    newCode=genCode();U={id:uid(),username:un,hash:h,toko,pin:await hash('pin:'+newCode)};upsert('Users',U);if(!cfg('toko'))upsert('Pengaturan',{key:'toko',value:toko});
  }else if(mode=='forgot'){
    if(!u)return toast('Nama pengguna atau kode pemulihan tidak cocok');
    const ok=u.pin?(await hash('pin:'+normCode(toko)))==u.pin:u.toko.toLowerCase()==(toko||'').toLowerCase();
    if(!ok)return toast(u.pin?'Nama pengguna atau kode pemulihan tidak cocok':'Nama pengguna atau nama toko tidak cocok');
    U={...u,hash:h};upsert('Users',U);
  }else{
    if(!u||u.hash!=h)return toast('Nama pengguna atau sandi salah');U=u;
  }
  localStorage.setItem('cj_u',U.id);
  if(newCode){const c=newCode;newCode='';start();showCode(c)}else{start();if(!U.pin)offerCode()}
}
/* kode pemulihan: acak, hanya hash-nya yang disimpan */
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(8));return[...r].map(x=>A[x%A.length]).join('')}
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function showCode(c){
  const f=c.slice(0,4)+'-'+c.slice(4);
  ovl(`<h3>Kode pemulihan Anda</h3><p class=big style="text-align:center;letter-spacing:.08em">${f}</p><p>Catat atau foto kode ini sekarang. Kode hanya ditampilkan sekali dan tidak bisa dilihat lagi. Dipakai di menu <b>Lupa sandi?</b> saat login.</p><div class=row style="margin-top:14px"><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${f}');toast('Kode disalin')">Salin</button><button class=p onclick=ovl()>Sudah saya simpan</button></div>`);
}
function offerCode(){ovl(`<h3>Buat kode pemulihan</h3><p>Kode ini dipakai kalau Anda lupa sandi. Tanpa kode, siapa pun yang tahu nama pengguna dan nama toko bisa mengganti sandi.</p><div class=row style="margin-top:14px"><button onclick=ovl()>Nanti</button><button class=p onclick=makeCode()>Buat sekarang</button></div>`)}
async function makeCode(){const c=genCode();U={...U,pin:await hash('pin:'+c)};upsert('Users',U);showCode(c)}
async function regenCode(){if(await hash($('#cp').value)!=U.hash)return toast('Sandi saat ini salah');makeCode()}
function logout(){localStorage.removeItem('cj_u');U=null;mode='in';loginView()}

/* ---------- Shell ---------- */
const TABS=[['kasir','Kasir','Kasir'],['stok','Stok barang','Stok'],['barang','Daftar barang','Barang'],['uang','Catatan uang','Uang'],['riwayat','Riwayat','Riwayat'],['laporan','Laporan','Laporan'],['set','Pengaturan','Atur']];
const IC={kasir:'M3 4h2l2.4 11h10.2L20 7H6.2M9 20h.01M17 20h.01',stok:'M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8',barang:'M4 6h16M4 12h16M4 18h10',uang:'M3 7h16a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM3 7l12-3v3M17 13h2',riwayat:'M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z',laporan:'M4 20V10M10 20V4M16 20v-7M22 20H2',set:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4'};
const ico=k=>`<svg class=i viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
function start(){
  document.documentElement.dataset.theme=cfg('tema')||'terang';
  const nm=esc(cfg('toko')||U.toko);
  $('#app').innerHTML=`<aside><div class=brand><div class=logo>CJ</div><div class=bn>${nm}</div></div><nav>${TABS.map(t=>`<button id=t_${t[0]} onclick="go('${t[0]}')">${ico(t[0])}<span class=lf>${t[1]}</span><span class=ls>${t[2]}</span></button>`).join('')}</nav><button class=out onclick=logout()>Keluar</button></aside><main><div class=mtop><span>${nm}</span><button onclick=logout()>Keluar</button></div><div id=v></div></main>`;
  go(tab);
}
function go(t){tab=t;scrollTo(0,0);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t_'+t));V[t]()}

/* ---------- Kasir ---------- */
V.kasir=()=>{cart={};payVal='';custName='';custHp='';payMeth='cash';payStat='lunas';$('#v').innerHTML=`<div class=kasir><section class=card><h2>Pilih barang</h2><input id=q type=search placeholder="Cari barang..." oninput=drawP()><div id=P class=grid></div></section><section class=cartp id=cartp><div class=row style="margin-bottom:8px"><h2 style="margin:0">Keranjang</h2><button class="s closeb" onclick=cartT(false)>Tutup</button></div><div id=C></div></section></div><button class="p cartbar" id=cb onclick=cartT(true)></button>`;drawP();drawC()};
const cartT=o=>$('#cartp').classList.toggle('open',o);
const qp=n=>{payVal=String(n||total());drawC()};
function drawP(){
  const q=($('#q')?.value||'').toLowerCase(),L=D.Barang.filter(b=>b.nama.toLowerCase().includes(q));
  $('#P').innerHTML=L.length?L.map(b=>`<button class=item onclick="add('${b.id}')" ${b.stok<=0?'disabled':''}><b>${esc(b.nama)}</b><span>${rp(b.harga)}</span><small>${b.stok>0?'Stok '+b.stok:'Habis'}</small></button>`).join(''):'<p class=empty style="grid-column:1/-1">Belum ada barang. Tambahkan di menu Daftar barang.</p>';
}
const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+q*bar(id).harga,0);
function add(id){const b=bar(id);if((cart[id]||0)>=b.stok)return toast('Stok '+b.nama+' tidak cukup');cart[id]=(cart[id]||0)+1;drawC()}
function setQ(id,v){const b=bar(id);v=Math.floor(Number(v)||0);if(v>b.stok){v=b.stok;toast('Stok tersisa '+b.stok)}v<=0?delete cart[id]:cart[id]=v;drawC()}
function drawC(){
  const e=Object.entries(cart),lunas=payStat=='lunas',qris=payMeth=='qris';
  $('#C').innerHTML=(e.length?e.map(([id,q])=>{const b=bar(id);return`<div class=row style="margin-bottom:8px"><div>${esc(b.nama)}<br><small class=mut>${rp(b.harga)}</small></div><div class="qty s"><button onclick="setQ('${id}',${q-1})">-</button><input type=number value=${q} onchange="setQ('${id}',this.value)"><button onclick="setQ('${id}',${q+1})">+</button></div><b class="s" style="min-width:80px;text-align:right">${rp(q*b.harga)}</b></div>`}).join(''):'<p class=empty>Ketuk barang untuk menambah.</p>')+
  `<hr style="border:0;border-top:1px solid var(--line)"><div class=row><span>Total</span><span class=big style="text-align:right">${rp(total())}</span></div>
  <label>Nama customer${lunas?' (opsional)':''}</label><input id=cn value="${esc(custName)}" oninput="custName=this.value" placeholder="Nama pembeli" autocomplete=off><label>No. HP / WhatsApp (opsional)</label><input id=ch type=tel inputmode=tel value="${esc(custHp)}" oninput="custHp=this.value" placeholder="08123456789" autocomplete=off>
  <label>Status pembayaran</label><div class=tabs style="margin:0"><button class="${lunas?'on':''}" onclick="setPS('lunas')">Lunas</button><button class="${lunas?'':'on'}" onclick="setPS('belum')">Belum lunas</button></div>
  <label>Metode pembayaran</label><div class=tabs style="margin:0"><button class="${payMeth=='cash'?'on':''}" onclick="setPM('cash')">Tunai</button><button class="${payMeth=='tf'?'on':''}" onclick="setPM('tf')">Transfer</button><button class="${qris?'on':''}" onclick="setPM('qris')">QRIS</button></div>
  ${qris?qrisBox():payMeth=='tf'?tfBox():''}

function calcK(){

const tfBox=()=>cfg('norek')?`<div style="margin:10px 0;padding:10px;border:2px solid var(--bd);border-radius:8px"><b>${esc(cfg('bank')||'Rekening')}</b><br><span class=big>${esc(cfg('norek'))}</span>${cfg('atasnama')?`<br>a.n. ${esc(cfg('atasnama'))}`:''}<div class=mut style="font-size:13px">Transfer sebesar ${rp(total())}</div></div>`:'<p class=mut style="font-size:13px;margin:10px 0">Data rekening belum diisi. Isi di menu Pengaturan.</p>';

const qrisBox=()=>cfg('qris')?`<div style="text-align:center;margin:10px 0"><img src="${cfg('qris')}" alt="QRIS" style="width:240px;max-width:100%;border:2px solid var(--bd);border-radius:8px;background:#fff"><div class=mut style="font-size:13px">Scan untuk membayar ${rp(total())}</div></div>`:'<p class=mut style="font-size:13px;margin:10px 0">Gambar QRIS belum diunggah. Unggah di menu Pengaturan.</p>';
function bayar(){

  if(lunas){if(payMeth!='cash')p=t;else if(p<t)return toast('Uang diterima kurang '+rp(t-p))}
  else{if(!nm)return toast('Isi nama customer untuk transaksi belum lunas');if(p>=t)return toast('Uang muka harus kurang dari total, atau pilih Lunas')}
  const its=Object.entries(cart).map(([id,qty])=>{const b=bar(id);return{id,nama:b.nama,harga:b.harga,modal:b.modal,qty}});
  const trx={id:'TRX-'+uid().toUpperCase(),waktu:new Date().toISOString(),items:JSON.stringify(its),total:t,bayar:p,kembali:lunas?p-t:0,customer:nm,hp,metode:payMeth,status:lunas?'lunas':'belum',tgllunas:''};

/* ---------- Invoice & WhatsApp ---------- */
function normHp(s){
  let n=String(s||'').replace(/\D/g,'');if(!n)return'';
  if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;
  return/^62\d{8,13}$/.test(n)?n:'';
}
const qrisLink=t=>API_URL&&cfg('qris')?API_URL+'?qris=1&n='+sisa(t):'';
function invText(t){
  const L=items(t).map((i,k)=>`${k+1}. ${i.nama} ${i.qty} x ${rp(i.harga)} = ${rp(i.qty*i.harga)}`);
  const tk=cfg('toko')||U.toko,al=cfg('alamat'),bl=isBelum(t);
  return [`*${bl?'TAGIHAN':'INVOICE'} ${tk}*`,al||null,'',`No: ${t.id}`,`Tanggal: ${new Date(t.waktu).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}`,t.customer?`Kepada: ${t.customer}`:null,'','Rincian:',...L,'',
    bl?`Total tagihan: ${rp(t.total)}`:`*Total yang harus dibayar: ${rp(t.total)}*`,
    bl?`Sudah dibayar: ${rp(t.bayar)}`:`Dibayar: ${rp(t.bayar)}`,
    !bl&&t.kembali>0?`Kembali: ${rp(t.kembali)}`:null,
    bl?`*Sisa yang harus dibayar: ${rp(sisa(t))}*`:null,
    `Metode: ${metLbl(t)}`,`Status: ${bl?'BELUM LUNAS':'LUNAS'}`,
    bl&&t.metode=='tf'&&cfg('norek')?`Transfer ke: ${cfg('bank')} ${cfg('norek')}${cfg('atasnama')?' a.n. '+cfg('atasnama'):''}`:null,
    bl&&t.metode=='qris'?(qrisLink(t)?`Bayar via QRIS: ${qrisLink(t)}`:'Pembayaran via QRIS, silakan scan gambar QRIS yang dikirim terpisah.'):null,
    '','Terima kasih sudah berbelanja 🙏']
    .filter(x=>x!==null).filter((x,i,a)=>x!==''||(i>0&&a[i-1]!=='')).join('\n');
}
function invDlg(id){
  const t=D.Transaksi.find(x=>x.id==id);if(!t)return;
  const q=isBelum(t)&&cfg('qris');
  ovl(`<h3>${isBelum(t)?'Tagihan':'Invoice'} ${esc(t.id)}</h3><pre style="white-space:pre-wrap;font:13px/1.4 'DM Mono',monospace;background:var(--bg);padding:10px;border-radius:8px;max-height:40dvh;overflow:auto;margin:0">${esc(invText(t))}</pre><label>No. WhatsApp customer</label><input id=wh type=tel inputmode=tel value="${esc(t.hp||'')}" placeholder="08123456789"><div class=row style="margin-top:14px"><button onclick=ovl()>Tutup</button><button class=p onclick="sendWA('${t.id}')">Kirim ke WhatsApp</button></div>${q?`<button style="width:100%;margin-top:8px" onclick=shareQris()>Bagikan gambar QRIS</button><p class=mut style="font-size:12px;margin:6px 0 0">${qrisLink(t)?'Pesan sudah berisi tautan halaman QRIS. Tombol ini opsional untuk mengirim gambarnya langsung.':'Tautan WhatsApp hanya bisa mengirim teks, jadi gambar QRIS dikirim lewat tombol ini.'}</p>`:''}`);
}
function qrisFile(){
  const u=cfg('qris');if(!u)return null;
  try{const m=u.match(/^data:(.*?);base64,(.*)$/),b=atob(m[2]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new File([a],'qris.'+(m[1].includes('png')?'png':'jpg'),{type:m[1]})}catch{return null}
}
function shareQris(){
  const f=qrisFile();if(!f)return toast('Unggah gambar QRIS di Pengaturan');
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:'QRIS pembayaran '+(cfg('toko')||U.toko)}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('Gambar QRIS diunduh. Lampirkan manual di chat WhatsApp.')}
}
function sendWA(id){
  const t=D.Transaksi.find(x=>x.id==id);if(!t)return;
  const hp=normHp($('#wh').value);if(!hp)return toast('Isi nomor WhatsApp yang valid');
  if(hp!=t.hp)upsert('Transaksi',{...t,hp});
  window.open('https://wa.me/'+hp+'?text='+encodeURIComponent(invText(t)),'_blank');
}

/* ---------- Catatan uang ---------- */
function daily(){
  const m={};const g=d=>m[d]=m[d]||{masuk:0,keluar:0};
  D.Keuangan.forEach(k=>g(k.tanggal)[k.jenis=='masuk'?'masuk':'keluar']+=k.jumlah);
  D.Transaksi.forEach(t=>{const d=dayOf(t.waktu);
    if(isBelum(t))g(d).masuk+=t.bayar;
    else if(t.tgllunas){g(d).masuk+=t.bayar;g(t.tgllunas).masuk+=t.total-t.bayar}
    else g(d).masuk+=t.total});
  let s=0;return Object.keys(m).sort().map(d=>{s+=m[d].masuk-m[d].keluar;return{d,...m[d],saldo:s}});
}
V.uang=()=>{
  const L=daily(),tdy=L.find(x=>x.d==today())||{masuk:0,keluar:0},saldo=L.length?L[L.length-1].saldo:0;

/* ---------- Laporan ---------- */
let per=7;
V.laporan=()=>{
  const cut=per?new Date(Date.now()-(per-1)*864e5).toLocaleDateString('sv'):'0000';
  const T=D.Transaksi.filter(t=>dayOf(t.waktu)>=cut),K=D.Keuangan.filter(k=>k.tanggal>=cut);
  let omzet=0,hpp=0;const piu=T.filter(isBelum).reduce((s,t)=>s+sisa(t),0);const prod={};
  T.forEach(t=>items(t).forEach(i=>{omzet+=i.qty*i.harga;hpp+=i.qty*i.modal;const p=prod[i.nama]=prod[i.nama]||{q:0,r:0};p.q+=i.qty;p.r+=i.qty*i.harga}));
  const out=K.filter(k=>k.jenis=='keluar').reduce((s,k)=>s+k.jumlah,0),inn=K.filter(k=>k.jenis=='masuk').reduce((s,k)=>s+k.jumlah,0),net=omzet-hpp+inn-out-piu;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toLocaleDateString('sv');return{d,v:D.Transaksi.filter(t=>dayOf(t.waktu)==d).reduce((s,t)=>s+t.total,0)}}),mx=Math.max(1,...days.map(x=>x.v));
  const top=Object.entries(prod).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  $('#v').innerHTML=`<div class=card><h3>Penjualan 7 hari terakhir</h3><svg viewBox="0 0 700 220" style="width:100%"><g font-size="12" fill="currentColor" text-anchor="middle">${days.map((x,i)=>{const h=x.v/mx*150,xx=20+i*95;return`<rect x="${xx}" y="${180-h}" width="70" height="${h}" rx="5" fill="var(--pri)"/><text x="${xx+35}" y="${172-h}">${x.v?rp(x.v):''}</text><text x="${xx+35}" y="205" class=mut>${x.d.slice(5)}</text>`}).join('')}</g></svg></div>
  <div class=row style="margin-bottom:10px"><h2 style="margin:0">Ringkasan</h2><select class=s style="width:auto" onchange="per=Number(this.value);V.laporan()">${[[1,'Hari ini'],[7,'7 hari'],[30,'30 hari'],[0,'Semua']].map(o=>`<option value=${o[0]} ${o[0]==per?'selected':''}>${o[1]}</option>`).join('')}</select></div>
  <div class=g2><div class=card><h3>Untung rugi</h3><table>${[['Penjualan',omzet],['Modal barang terjual',-hpp],['Pemasukan lain',inn],['Belum diterima (belum lunas)',-piu],['Pengeluaran',-out]].map(r=>`<tr><td>${r[0]}<td class=r>${rp(r[1])}</tr>`).join('')}<tr><td><b>${net<0?'Rugi':'Untung'} bersih</b><td class="r ${net<0?'bad':'ok'}"><b>${rp(Math.abs(net))}</b></tr></table></div>
  <div class=card><h3>Barang paling laku</h3>${top.length?`<table>${top.map(([n,p])=>`<tr><td>${esc(n)}<td class=r>${p.q} terjual<td class=r>${rp(p.r)}</tr>`).join('')}</table>`:'<p class=empty>Belum ada penjualan pada periode ini.</p>'}</div></div>`;
};

/* ---------- Pengaturan ---------- */
V.set=()=>{$('#v').innerHTML=`<div class=g2><div class=card><h3>Profil toko</h3><label>Nama toko</label><input id=sn value="${esc(cfg('toko')||U.toko)}"><label>Alamat</label><input id=sa value="${esc(cfg('alamat'))}"><label>Tampilan</label><select id=st><option value=terang ${cfg('tema')!='gelap'?'selected':''}>Terang<option value=gelap ${cfg('tema')=='gelap'?'selected':''}>Gelap</select><p><button class=p onclick=saveS()>Simpan pengaturan</button></p></div>
<div class=card><h3>Keamanan akun</h3><p class=mut>Kode pemulihan: <b>${U.pin?'sudah dibuat':'belum dibuat'}</b></p><label>Sandi saat ini</label><input id=cp type=password autocomplete=current-password><p><button class=p onclick=regenCode()>${U.pin?'Buat kode pemulihan baru':'Buat kode pemulihan'}</button></p><p class=mut style="font-size:13px">Membuat kode baru membuat kode lama tidak berlaku.</p></div>
<div class=card><h3>Transfer bank</h3><label>Nama bank</label><input id=bk value="${esc(cfg('bank'))}" placeholder="BCA / BRI / Mandiri"><label>Nomor rekening</label><input id=nr inputmode=numeric value="${esc(cfg('norek'))}"><label>Atas nama</label><input id=an value="${esc(cfg('atasnama'))}"><p><button class=p onclick=saveBank()>Simpan rekening</button></p></div>
<div class=card><h3>Pembayaran QRIS</h3>${cfg('qris')?`<p style="text-align:center"><img src="${cfg('qris')}" alt="QRIS" style="width:220px;max-width:100%;border:2px solid var(--bd);border-radius:8px;background:#fff"></p>`:'<p class=mut>Belum ada gambar QRIS.</p>'}<label>Unggah gambar QRIS</label><input type=file accept="image/*" onchange="upQris(this)">${cfg('qris')?'<p><button class=d onclick=delQris()>Hapus QRIS</button></p>':''}<p class=mut style="font-size:13px">Gambar tampil di kasir saat memilih QRIS dan bisa dibagikan ke WhatsApp customer.</p></div>
<div class=card><h3>Cadangan data</h3><p class=mut>Penyimpanan: <b>${API_URL?'Google Sheets':'Lokal di browser (demo)'}</b></p><p><button onclick=exportD()>Unduh cadangan (.json)</button></p><label>Pulihkan dari file cadangan</label><input type=file onchange=importD(this)></div></div>`};
function saveBank(){upsert('Pengaturan',{key:'bank',value:bk.value.trim()});upsert('Pengaturan',{key:'norek',value:nr.value.trim()});upsert('Pengaturan',{key:'atasnama',value:an.value.trim()});toast('Rekening tersimpan')}
function upQris(el){const f=el.files[0];if(!f)return;upQris2(f).finally(()=>{try{el.value=''}catch{}})}
async function upQris2(f){
  if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name))return toast('PDF tidak bisa dipakai. Screenshot QRIS lalu unggah sebagai JPG atau PNG');
  let src=null,w=0,hh=0;
  try{src=await createImageBitmap(f);w=src.width;hh=src.height}catch{
    try{
      const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
      src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=u});w=src.naturalWidth;hh=src.naturalHeight;
    }catch{src=null}
  }
  if(!src||!w||!hh)return toast('Format gambar tidak didukung ('+(f.type||f.name.split('.').pop()||'tidak dikenal')+', '+Math.round(f.size/1024)+' KB). Gunakan JPG atau PNG, misalnya screenshot QRIS.');
  let s=520,q=.8,d='';
  for(let k=0;k<6;k++){
    const r=Math.min(1,s/Math.max(w,hh)),c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(hh*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
    d=c.toDataURL('image/png');if(d.length>=45000)d=c.toDataURL('image/jpeg',q);
    if(d.length<45000)break;s*=.88;q=Math.max(.55,q-.06)
  }
  if(d.length>=49000)return toast('Gambar terlalu besar, coba gambar QRIS yang lebih sederhana');
  upsert('Pengaturan',{key:'qris',value:d});toast('QRIS tersimpan');V.set()
}
function delQris(){upsert('Pengaturan',{key:'qris',value:''});toast('QRIS dihapus');V.set()}
function saveS(){upsert('Pengaturan',{key:'toko',value:sn.value.trim()});upsert('Pengaturan',{key:'alamat',value:sa.value.trim()});upsert('Pengaturan',{key:'tema',value:st.value});toast('Pengaturan tersimpan');start();go('set')}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='catat-jualan-'+today()+'.json';a.click()}
function importD(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o||typeof o!='object')throw 0;
    const have=new Set(D.Users.map(u=>u.id));let n=0;
    ['Users','Barang','Transaksi','Keuangan','Pengaturan'].forEach(sh=>{
      let rows=Array.isArray(o[sh])?o[sh]:[];if(sh=='Users')rows=rows.filter(u=>!have.has(u.id));
      n+=rows.length;for(let i=0;i<rows.length;i+=200)bulk(sh,rows.slice(i,i+200));
    });
    toast('Memulihkan '+n+' data...');start();go('set');
  }catch{toast('File cadangan tidak valid')}};
  r.onerror=()=>toast('File tidak bisa dibaca');
  r.readAsText(f);r.onloadend=()=>{try{el.value=''}catch{}};
}

/* ---------- Mulai ---------- */
(async()=>{await load();const id=localStorage.getItem('cj_u');U=D.Users.find(u=>u.id==id)||null;if(!D.Users.length)mode='up';U?start():loginView()})();
</script>
